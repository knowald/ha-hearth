name: Publish Docker image

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  workflow_dispatch:
  push:
    branches: [master]
  release:
    types: [published]

jobs:
  build-and-push-image:
    name: Push Docker image to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # pull requests only warn about missing translations; a release must ship every locale complete
      - name: Set up Node.js
        if: github.event_name == 'release'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Translations complete
        if: github.event_name == 'release'
        run: node scripts/check-translations.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # stable releases produce <version> + latest, prereleases produce
          # <version> + beta, pushes to master produce edge and manual runs
          # from a branch produce <branch>
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=beta,enable=${{ github.event.release.prerelease == true }}
            type=edge,branch=master
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: |
            latest=auto

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
